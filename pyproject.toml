[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "lacing"
version = "0.0.63"
description = "Interval annotation system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "pydantic>=2.6",
    "intervaltree>=3.1",
    "cw>=0.1.1,<0.2",
    "dol>=0.3.37",
]

[project.scripts]
lacing = "lacing.cli:main"

[project.urls]
Homepage = "https://github.com/thorwhalen/lacing"
Repository = "https://github.com/thorwhalen/lacing"
Documentation = "https://thorwhalen.github.io/lacing"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    # anyio provides the pytest plugin that handles @pytest.mark.anyio
    # (tests/test_processors.py::test_run_async). It was only present locally
    # (transitively) — CI's clean .[dev] install lacked it, so the async test
    # errored "async def functions are not natively supported". Explicit now.
    "anyio>=4.0",
    "praatio>=6.0",
    "pympi-ling>=1.7",
    "jams>=0.3",
    # Used by tests/test_time_json_schema.py to check the exported JSON Schema
    # really rejects a float tick; present transitively before, explicit now.
    "jsonschema>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "pytest-postgresql>=6.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    # See the [mcp] extra: `fastmcp`, not `mcp`, is what provides FastMCP now.
    "fastmcp>=3",
    "opentimelineio>=0.17",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "s3dol>=1",
    "moto[s3]>=5.0",
    "sqldol",
    "sqlalchemy>=1.4",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
s3 = [
    "s3dol>=1",
]
sql = [
    "sqldol",
    "sqlalchemy>=1.4",
]
textgrid = [
    "praatio>=6.0",
]
eaf = [
    "pympi-ling>=1.7",
]
jams = [
    "jams>=0.3",
]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
]
server = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "uvicorn>=0.20",
]
mcp = [
    # The standalone `fastmcp` distribution, NOT the `mcp` SDK: mcp 2.0 removed
    # the FastMCP it used to vendor at `mcp.server.fastmcp`, so `mcp>=1.0`
    # silently resolved to a version without the class this extra exists to
    # provide. `lacing.server.mcp` still accepts an mcp 1.x install if that is
    # what an environment already has.
    "fastmcp>=3",
]
arq = [
    "arq>=0.25",
]
otio = [
    "opentimelineio>=0.17",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
exhibit = [
    # Artifact-exhibit export (lacing.exhibit). HTML needs nothing
    # extra; the PDF / Markdown derivations need these. weasyprint is
    # used over wkhtmltopdf because it is the only HTML→PDF engine that
    # carries the in-document artifact↔artifact anchor links through to
    # clickable PDF links.
    "weasyprint>=60",
    # dn.html_to_markdown needs markdownify (dn's ``html`` extra); 0.0.15 is the
    # first dn release that uses markdownify (MIT) instead of html2text (GPL).
    "dn[html]>=0.0.15",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "lacing",
    "tests",
]
addopts = "--doctest-modules"
doctest_optionflags = [
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

# Install the `dev` extra in CI. Without this, read-ci-config emits empty
# install-extras and the reusable workflow runs `uv pip install -e .` (core
# only) — so test-only deps (anyio for @pytest.mark.anyio, fastapi/httpx,
# praatio/jams, moto, …) are absent and their tests fail/skip in CI while
# passing locally.
[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
